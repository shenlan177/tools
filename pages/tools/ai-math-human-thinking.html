        const rawMd = `# AI 时代的数学方法与人类思维

**作者：Tanya Klowden, Terence Tao**

### 摘要
人工智能 (AI) 是广泛用于描述设计执行日益复杂认知任务（包括许多曾被认为是人类独有领域的工作）的一系列计算机工具的统称。随着这些工具变得几何级精妙并无处不在，对其快速发展并融入社会的合理性正频繁受到质疑，特别是当它们消耗有限资源并对它们看似正在取代的技术人员的生计构成生存风险时。在本论文中，我们探讨了 AI 对传统哲学问题的快速演变影响，重点关注其在数学领域中的应用及其在更广泛的现实世界用途中所产生的更普遍成果。我们断言，人工智能是人类历史上为促进思想创造、组织和传播而开发的工具的自然演进，并主张 AI 的开发与应用必须始终以人为中心。为了创新解决方案以满足人类需求、提升人类生活质量、扩展人类思维与理解能力，我们提出了一条将 AI 融入我们最具挑战性和智力严谨领域的路径，从而造福全人类。

---

### 1. 引言

在标准的办公工具中撰写本文的过程中，居然有不少于三个不同的数字智能助手未经请求便强行插足到叙述中，这足以证明人工智能 (AI) 技术已经以惊人的速度渗透到了数字生活的每一个角落[^1]（[^1]：所有这些 AI 的“贡献”都已迅速从正文中移除）。人类正站在一场史无前例的数字工业革命的门槛上。在自然科学领域，AI 的进步已经催生了诺贝尔奖级别的研究 [[2](https://arxiv.org/html/2603.26524v1#bib.bib2), [3](https://arxiv.org/html/2603.26524v1#bib.bib3)]；而在人文领域，人们普遍担心现代 AI 的生成式文本能力可能会导致学科的消亡 [[27](https://arxiv.org/html/2603.26524v1#bib.bib27)]。当语言翻译器为文化交流和国际合作敞开大门时，由深度伪造 (deepfakes) 和“数字垃圾 (slop)”构成的洪流也紧随其后，在我们的数字社交空间中肆意横行。AI 迅速从一种新鲜事，变成了一种至关重要的资源，并在某些情况下，演变成了一种现实存在的生存威胁 [3]。

#### 1.1 我们对人工智能的定义
在本文的语境下，AI 指的是旨在执行日益复杂的认知任务（包括许多曾被认为是人类独有领域的工作）的广泛计算机工具。AI 工具极其多样化，既包括当今以数据驱动的机器学习 (ML) 技术（例如能够处理复杂文本的大语言模型 (LLM)，或能够生成图像及其他媒体的扩散模型），也包括更为传统的“老派人工智能 (GOFAI)”（例如自动定理证明器或国际象棋引擎），后者能够通过应用精确的数学规则来解决狭窄范围的问题。

#### 1.2 本文的目的
关于这些工具“能做”或“不能做”什么的讨论已经汗牛充栋；但相比之下，很少有人讨论这些工具为何如此迅速地被开发和部署，或者它们如何影响数以十亿计在研究、教育、工作、游戏甚至休息中与之互动的生活 [[30](https://arxiv.org/html/2603.26524v1#bib.bib30)]。本文的作者来自两个经常被视为对极的学术领域：数学和艺术研究。但我们都发现，在日常工作中将若干 AI 工具融入到各自截然不同的研究领域是大有裨益的，并且我们惊讶地发现，在现实世界使用 AI 所提出的非常混乱但具有普遍性的哲学问题上，我们有着大量的共识。

以数学为模型，我们将探讨将 AI 融入常规工作流程的收益、风险、伦理和产出，然后将这些观察扩展到更广泛的现实应用中。尽管这些新的、未必具有道德中立性的技术带来了风险，但我们从两方面主张应当在数学及其他领域开发、实施和应用 AI 工具：其一，它们具有从根本上增强我们人类自然能力的潜力；其二，它们能够扩展那些我们仅凭个人或在自身集体能力限制下无法实现的各种可能性。结合我们使用这些工具的亲身经验，我们特别审视了人机交互界面，并就这些技术的发展演进提出建议，旨在使其对人类的益处大于危害，并使人类的思想与行动在未来的 AI 发展进程中能与新范式协同共生，体现出其独特的价值。

#### 1.3 浮士德式的契约 (The Faustian Bargain)
市场竞争的激励机制推动了 AI 技术的疯狂发展，并以激进加速的工作流程和成本节约的愿景迷住了整个产业。这种竞争带来的“囚徒困境”压力，迫使许多个人和机构尽可能匆忙地尝试采用这些工具，而牺牲了对这种采用所带来的经济、社会或道德成本与收益的更深思熟虑的评估——或者更根本地，忽略了我们首要的任务：为什么要开发这些技术。因此，在事实上，我们集体已经与这些技术达成了一份“浮士德式的契约”：我们将越来越多的数据、认知流和决策过程交由它们处理，以换取能够以更高效率、更少枯燥劳动完成更广泛任务的承诺。

从理论上讲，技术在道德上是中立的；它既可以助力积极的用例，也可以助长消极的用例。但通过这种助力，它加剧了现有的道德困境，并催生了新的困境。例如，二战期间对囚犯进行的恐怖医学研究虽然产生了关于人类耐力极限的救命数据，但也提出了一个令人痛苦的问题：使用此类数据开发新的医学成果在伦理上是否正当 [[37](https://arxiv.org/html/2603.26524v1#bib.bib36)]。虽然没那么血腥，但今天当前这一代 AI 工具训练所使用的数据及知识产权的模糊来源，可以说也引发了类似的疑问 [[40](https://arxiv.org/html/2603.26524v1#bib.bib39)]。

当一项技术发展得足够缓慢时，我们有可能在它被广泛部署之前进行必要的哲学对话和辩论；干细胞研究就是一个显著的例子。然而，现代 AI 技术已经广泛部署，没有任何实际方法能“让神灯里的妖怪回到瓶子里”；讽刺的是，此时实施严厉的监管会不成比例地扼杀 AI 在加速科学研究等方面的积极应用，却无法消除该技术的浪费性或恶意用途。从务实的角度来看，关于 AI 的讨论现在已经转向如何管理与这些技术的共存：评估 AI 的成本与收益（无论是在学术领域还是更广泛的社会中），并确定最佳实践和框架，以尽可能积极的方式使用 AI，同时遏制那些可能降低我们认知成就的可靠性和价值的滥用行为。

---

### 2. 历史平行比较：这次有什么不同？

#### 2.1 过去自动化技术的整合
自动化当然不是一个新现象。许多过去的技术也实现了任务自动化（这些任务以前分配给人类），消除或大幅减少了对某些类型人类工作的需求，同时创造或增加了对另一些工作的需求。例如，在科学界，由于其显而易见的优势，曾发生过广泛且迅速转向新工具（如互联网、科学计算用计算机，甚至像 LaTeX 这样简朴的排版语言）的“相变”。

但这些过去的技术大多只影响了职业的次要方面，例如结果的交流和传播，而不是结果的创造本身符。而且，尽管由这些工具自动完成的任务需要专门的训练和专业知识才能执行，但它们通常不需要对职业更深层次的哲学层面有理解，例如知识的本质、美、意义或道德 [[11](https://arxiv.org/html/2603.26524v1#bib.bib12)]。当然，这些技术仍可能引发关于哲学话题的讨论——例如，一件原创艺术品是否存在任何机械复制都无法妥善捕捉的固有美学或创造性特征；或者工业革命引起劳动力迁移所产生的道德和伦理影响——但它们并不被认为挑战了此类讨论背后的基本哲学假设。例如，印刷机的发明革命化了信息和思想的交流，但它并没有显著改变对“思想”或“信息”本质的理解；这些内容的原始生成仍然是由人类深思熟虑的行为完成的。

#### 2.2 现代 AI
但现代 AI 可以自动化创作过程本身的很大一部分，使得智力产品（如艺术品、数学证明，或科学及哲学理论）的大规模生成成为可能，且所需的人类监管远少于以往[^2]（[^2]：目前的工具通常仍需要人类生成初始提示词供 AI 遵循，但这一过程本身现在也可以在很大程度上实现自动化）。这在这些产品的外在形式与用于创造这些产品的价值和思维过程之间，造成了一种前所未有的脱钩。例如，扩散模型现在可以创造出一幅令人赏心悦目的风景画，它并不是直接受到物理世界中任何特定地点的启发而创作的，尽管无数实际风景的图像（以及许多与风景完全无关的图像）肯定被用于训练该模型的输出；因此，图像带来的美学感知与其美学的原始来源发生了脱钩。

这绝非全新的哲学领域。塞尔 (Searle) 的“中国房间”思想实验 [[32](https://arxiv.org/html/2603.26524v1#bib.bib33)]——关于一个被编程为用中文交谈的机械设备是否真正理解这门语言的问题——可以追溯到 1980 年。大约在那个时候，“AI 效应 (AI effect)”也为人所知；例如，下棋能力曾被视为衡量智力的标准，直到能够通过对博弈树进行机械式探索、从而“无脑地”超越围棋大师的象棋引擎出现，在那一刻，智力的“象棋测试”在很大程度上被放弃了。著名的“图灵测试”——关于 AI 是否能以与人类无法区分的方式进行交流——同样已被现代 LLM 有效通过 [[29](https://arxiv.org/html/2603.26524v1#bib.bib41)]，从而让出了其曾经作为人工智能“金标准”的地位。关于更近期的讨论，请参见 [[10](https://arxiv.org/html/2603.26524v1#bib.bib52)]。

目前，我们仍然可以指出“根本性”理解的标志，例如是否有能力连贯地解释和辩护导致一件新艺术品、数学证明或其他智力产品产生的创作过程。这仍然是区分人类生成内容与 AI 生成内容的有效测试。但如果未来的 AI 也能设法令人信服地通过此类测试，我们是否必须再次移动关于“智能”、“理解”和“创造力”究竟是什么的球门柱？数学和人文学科等领域的定义、价值和目标是否需要重新评估？我们应该赋予这些日益精妙的 AI 工具何种地位——它们将是助手、合著者，甚至是拥有独立地位的创造者？如果是这样，我们该如何对待它们产出的内容，以及导致这些内容产生的智力过程？

---

### 3. 数学作为 AI 使用的“实验场”

关于 AI 的这些更广泛的哲学问题极其复杂且多面，我们当然不打算对其中任何一个给出决定性的解决方案；而且这一领域的变化速度如此之快，以至于我们做出的任何声明都有被惊人的新技术进步所超越的风险。然而，我们可以从数学世界提供一些视角，既涉及纯数学推理领域，也涉及当今数学分析在人文领域的新兴应用。我们将数学视为探索诸如 AI 对各科学领域（以及整个社会）影响等广泛问题的合适“实验场 (sandbox)”，因为它拥有更古老、更先进的基础，且其本质非常适合探索各种违背现实的假设性抽象场景。我们希望从将 AI 融入（或不融入）数学中所吸取的教训，能为 AI 将如何与科学及一般社会互动提供更广阔的视角。

前沿 AI 模型现在可以解决日益复杂的数学问题，其证明可以被独立验证，而无需直接再现人类数学家的解题实践（例如测试特殊情况，然后从这些例子中总结一般规律），尽管其训练数据中会包含按这种传统方式生成的证明。因此，数学家将越来越多地遇到这样一种情况：证明定理的能力与发现和理解此类证明所需的推理过程发生了脱钩。这加剧了现代数学现有的去中心化趋势；在一个各领域应用极其广泛都需要高等数学的世界里，由中央权威规定数学正统实践的“布尔巴基时代 (Bourbaki era)” [[28](https://arxiv.org/html/2603.26524v1#bib.bib28)] 已经是几十年前的往事了[^3]（[^3]：尽管有人可能会争辩说，目前正在进行的创建大型统一形式数学库的项目，如 Lean 的 Mathlib 项目，可能是布尔巴基小组努力的现代继承者）。

在目前的技术水平下，最精妙的 AI 工具仍表现出显著且往往离奇的弱点；它们在某些任务中可以达到卓越的超人表现，同时在另一些任务中却表现出往往令人梯笑皆非的低级误解和错误。数学也不例外。AI 生成的数学在表面上可能看起来完美无缺——这是可以预见的，因为这些模型旨在产生视觉上尽可能接近人类生成的正确证明的输出——但同时也可能犯下根本性的错误（例如断言所有奇数都是质数），这种错误在人类数学家训练的早期阶段就会被纠正，且往往会使随后的论证变得荒谬到无法挽救。与此同时，这种主要关注生成“看起来不错”的输出、而非关注传统上创造此类输出所需的基本认知过程的“自顶向下”方法，可能会出奇地有效：那个经常犯基础数学错误的 AI，也可能神秘地以高于人类专家的准确率得出复杂数学问题的正确答案，甚至提供一个古怪但在技术上正确的证明来确证答案的有效性。

目前人们正投入巨大努力，试图尽可能地减少或消除 AI 的这些弱点。这通常不是通过直接增强 AI 对任何特定智力任务的固有“理解”，而是通过将此类 AI 工具置于一个严密的独立测试、训练和验证环境中，以减少错误的数值发生率。解决深奥的数学猜想目前仍超出了完全自主 AI 的能力范围，但在不久的将来，此类 AI 工具极有可能在这些工作中极大地辅助人类数学家，即使我们仍会犹豫是否将这种辅助描述为真正智能思想的表达。尽管如此，这种针对数学这样一门高度智力化学科的机械化且易错的方法，竟然能够（或即将能够）产生如此多该学科传统的质量标志，这一事实表明，我们必须重新评估我们关于智能或创造力究竟是什么、以及如何衡量它们的模型。

### 4. AI 与数学真理的本质

#### 4.1 数学与证明标准
数学[^4]（[^4]：这里我们对“数学究竟是什么”这一概念保持模糊处理。可以采用规范论（prescriptivist）视角，例如使用 Davis-Hersh 的定义 [[41](https://arxiv.org/html/2603.26524v1#bib.bib15)]，将数学视为“对具有可重复性质的精神对象的研究”。也可以采用描述论（descriptivist）视角，即数学是数学家在实际中所从事的活动。我们这里的讨论稍微倾向于后者视角。）自欧几里得开始，就有着客观证明标准的悠久传统，并随着 20 世纪初稳定且（经验上）安全的数学基础的出现而进一步完善。有人指出 [[45](https://arxiv.org/html/2603.26524v1#bib.bib13)]，这些基础几乎被普遍接受，赋予了现代数学一种罕见且珍贵的能力，即在领域内对任何给定的论证或断言的有效性达成共识。因为（在原则上）人们可以坚持将此类论证解释到如此精细的程度，以至于每一步都可以被检查为标准公理和逻辑推理规则的正确应用。一个典型的例子是 Nelson [6] 在 2011 年声称皮亚诺公理 (Peano Axioms) 在逻辑上是不一致的；这一主张远非数学主流，但人们仍有可能通过指出论证中的一处细微缺陷来解决这一问题，Nelson 欣然接受了这一点并撤回了主张。

然而，在实践中，人类数学家的论证往往达不到完美严密证明的理想状态；文献中常见的或大或小的错误屡见不鲜，其中一些通过正式的勘误或修订得到纠正，另一些则被忽视或作为该子领域“民间传说 (folklore)”的一部分非正式地流传。启发式上看似合理的论证往往在极少的检查下就被接受，而违背传统认知的惊人断言则会遭到强烈的质疑，即使这些论证在逐行阅读下最终被证明是正确的。

#### 4.2 气味测试 (The Smell Test)
直到现在，这种状态还是相当令人满意的；遵循良好启发式和直觉的人类数学家往往能产生很大程度上正确且具有说服力的证明，大多数错误也是可修复的；而缺乏此类直觉的数学家往往产生的证明包含如此多的表面问题，以至于人们在仔细检查内容之前就有理由产生怀疑。非正式地讲，人类生成的数学论证往往带有一种“气味”[^5]（[^5]：我们使用这种感官比喻，类似于软件工程中的“代码异味 (code smell)”概念。），资深数学家（可能是下意识地）利用这种气味在能够检查该论证的每一个具体步骤之前就获得对其说服力的初步印象。例如，Aaronson 的博客文章《声称的数学突破是错误的十个迹象》[[1](https://arxiv.org/html/2603.26524v1#bib.bib1)] 列举了一些带有此类“坏气味”的论证的常见示例，人们在定位到具体的逻辑缺陷之前就能探测到它们。而且，并非所有错误都同样具有灾难性；有些错误甚至可能具有某种积极价值，例如在能够完全验证之前揭示了一种很有前途的方法 [[16](https://arxiv.org/html/2603.26524v1#bib.bib17)]。

正如瑟斯顿 (Thurston) 所指出的[^6]（[^6]：另见本文第二作者的文章 [[39](https://arxiv.org/html/2603.26524v1#bib.bib38)]，该文认为，“好”数学无论最初如何定义，在实践中往往倾向于融入更广泛的数学叙事，例如结构与随机性之间的二分法，或者代数探索几何问题的能力（反之亦然）。）[[42](https://arxiv.org/html/2603.26524v1#bib.bib40)]，一种带有“好气味”的要素是论证提供理解或洞见的感觉：它不仅显示了某组假设在逻辑上必然导致给定的结论，而且还为这种因果叙事提供了可能，指出了论证的哪些部分承担了“重任”，哪些部分与先前文献相比具有新意或令人惊讶，而哪些部分仅是常规的技术考虑。这些对数学文本的解释和印象通常没有被捕获在严密数学的正式框架（如一阶逻辑或集合论）中；但对于阅读该论证的人类数学家来说，它们对于得出关于论证如何推广到其他场景或如何与文献中其他方法互动的更广泛教益至关重要。此类叙事结构还有助于增强对论证稳健性的信心：计算中的一个符号错位就可能使一段漫长的数学论证失效，但如果证明在如何系统地剥离和解决关键困难方面有清晰的策略（并借鉴了文献中先前成功的类比），那么论证中的局部错误就更有可能在保持原始证明精髓的情况下被修复。

#### 4.3 形式化能拯救这一切吗？
有几种发展趋势可能会迫使数学界重新评估这种半形式化的证明标准。其中之一是技术层面的：随着数学日益成熟和复杂（且日益由计算机辅助），论证变得越来越长、越来越复杂，某些领域的尖端论文通常超过一百页，这使得人类审稿人的逐行验证变得日益沉重。在实践中，这意味着除了最高规格和最重要的结果外，这种细致的检查并不总是能被执行，导致人们对上述“气味”的依赖日益增加（甚至过度依赖）来评估数学论证的可信度。

这种问题似乎有可能通过技术手段得到解决（或至少得到缓解），特别是通过更广泛地部署形式化证明助手（如 Lean 或 Rocq），如果数学论证是用某种精确的计算机语言编写的，这些助手就能自动检查其有效性 [[15](https://arxiv.org/html/2603.26524v1#bib.bib50)]。目前这种形式化工作对于系统化部署来说仍然过于繁琐（将传统的、非正式编写的证明转换为此类形式化语言通常比最初编写该证明要长五到十倍），但人们正致力于使这一过程更快、更用户友好，例如通过集成 AI 工具来实现部分（甚至可能是完全的）“自动形式化” [[48](https://arxiv.org/html/2603.26524v1#bib.bib48)]。

#### 4.4 形式化验证的局限性
但是，即使这些技术问题得到解决，且数学证明常规地配有形式化的正确性验证，仍会出现几个新问题，特别是在不久的将来，日益复杂的论证可能部分或全部由 AI 工具生成。首先，形式化验证仅证明形式化论证建立了一个形式化数学命题，但并不排除在形式化命题与最初预想的命题之间的翻译过程中出现错误。例如，费马大定理断言，对于任何大于 2 的自然数 \$n\$，方程 \$a^n + b^n = c^n\$ 没有自然数解 \$a, b, c\$；但在这种非正式描述中隐含了一个约定，即自然数从 1 开始而不是从 0 开始。一个被指派解决此问题的 AI 可能会错误地假设 \$a, b, c\$ 允许为零，并据此产生一个（形式化验证通过的）证明，证明费马大定理是错误的！因此，虽然形式化在原则上可以显著减少对非正式数学文本进行细致人工审查的需求，但它并不能完全消除这种需求[^7]（[^7]：理论上甚至可能通过巧妙操纵标准形式数学库（如 Mathlib）中关键定义的定义，来“黑掉”数学本身；参见 [[38](https://arxiv.org/html/2603.26524v1#bib.bib37)]。讽刺的是，数学研究日益增强的协作性、社会性和大规模化，虽然总体上是一个非常积极的发展，但也可能增加对此类攻击的潜在脆弱性。在以往数学主要由少数人完成的时代，这并不是一个显著的问题）。

其次，即使在高等数学的纯抽象背景下，给定的论证也只有一部分可以用适于形式化的演绎逻辑来表达。虽然演绎证明仍然是大多数数学工作的关键核心，但在这一核心周围有一层启发式、经验性或元数学推理的“半影 (penumbra)”，它提供了关于论证为何奏效、是否可以扩展到其他语境、追求这些问题的动机是什么，以及人们如何从更基本的原理中重建论证的宝贵信息。人类编写的证明在其本质上往往会在写作过程中有机地提供这一“半影”（特别是如果作者擅长阐述）；但一个专门针对形式正确性标准训练的 AI，以牺牲所有其他考虑为代价，可能会产生“无味 (odorless)”的证明——尽管它们表面上类似于书写良好的、甚至可能通过形式化验证测试的人类证明，但却出奇地不尽如人意：它们虽然一成不变地实现了建立给定数学断言的明确目标，但产出的关于该断言所属广泛数学领域的见解却远少于预期。在一个所有生成媒体都被 AI 抛光得亮丽如新（包括排版精美且由 GPT 产生的清晰逻辑解释的数学证明）的世界里，放弃了那些更为粗笨、混乱的手写（或至少是手敲）文本世界，是否会丢失某些东西？

#### 4.5 对早期挑战的适应
数学界已经适应了其证明标准所面临的早期技术挑战。大型计算机辅助证明，如四色定理的证明 [[4](https://arxiv.org/html/2603.26524v1#bib.bib7)] 或开普勒猜想的证明 [[19](https://arxiv.org/html/2603.26524v1#bib.bib23)]，最初引起了很大争议，因为它们在实际中无法通过手工完全检查；但随着时间的推移，针对此类论证建立信心的新标准也确立了。例如，提供可复制的代码，将论证的计算部分分离到特定的、明确阐述的引理中（并与论文中偏向概念的部分分开），以及提供额外的相关数据和“校验和”，以检查计算机生成的计算是否符合各种“常识检查 (sanity checks)”。实际上，这些发展将数学中的证明标准推向了自然科学的方向，即只要经过适当的设计、执行和报告，理论论证和经验实验都是科学真理的可接受来源。

#### 4.6 AI 辅助数学的演变
随着显著的 AI 辅助或由 AI 生成的数学的出现，类似的演变将会发生[^8]（[^8]：我们这里的思考受到了其他数学家对此话题观点的启发，包括 [[44, 17, 16, 5] 以及 [[34, 35]] 中的更广泛讨论。）。生产经过验证的演绎证明的负担可能越来越多地落在计算机而非人类身上，证明将越来越多地被重构[^9]([^9]：关于此类重构的若干具体例子和这些发展的进一步探讨，请参见 [[25]），以便原本被精心安排为可由人类验证的枯燥计算，日益外包给软件工具。例如，数学中那些臭名昭著的短语，如“证明留给读者自证”或“通过标准论证，我们有”，将被替换为对 LLM 的调用，由其产生对这些断言的既可由人类阅读、又能由计算机验证的正当理由。随着自动形式化水平的进步，探索给定论证如何随着数学基础的具体选择而变化也将变得显著容易，从而允许在讨论数学结果本身的同时，也对其进行严密的元数学[^10]（[^10]：此类元数学的一个例子是定理的逆向数学 (reverse mathematics, 见 [[36]])。它旨在了解建立给定的结果实际上需要哪些数学公理（如选择公理或排中律）。传统上，对某项结果的逆向数学探讨通常要在该结果被原始证明多年后才进行，且需要专门的逻辑训练以及对该定理所属子领域的专业知识。）探讨。

与此同时，人类数学家在未来可能会将更多的注意力和精力集中在数学推理的“软性”方面。例如探索结果的启发式方法和动力，选择证明策略，支持（或反对）结果的实验性证据[^11]（[^11]：特别是考虑到 AI 能够在没有类似形式证明的情况下，“猜测”出甚至非常复杂的数学问题的答案，因此日益有必要开发标准的程序，以负责任的方式在数学文献中引用并整合这些未经证实的猜想。），或者导致发现有效论证的试错过程。这些方面不像演绎证明那样容易被自动验证和衡量，因此也不太适合诸如强化学习之类的机器学习策略[^12]（[^12]：自动化数学研究过程这些方面的另一个障碍是相对缺乏数据；已发表的文献往往专注于结果的成功证明，而不愿意详细记录导致这些证明产生的（往往非常丰富和微妙的）正式和非正式过程。）。可以预见，职业数学家可能会越来越多地采用其他学科（如理论和实验科学，甚至人文学科）的论证模式，以其他类型的推理（如实验数据的统计分析，或由已证实的数学结果和非严密的哲学原理共同引导的推测性理论化）来支持他们的核心演绎论证。从历史上看[^14]（[^14]：例如，Jaffe 和 Quinn [21] 先前关于系统性建立“理论数学”领域的提案遭到了职业数学家的普遍负面回应，导致了包括上述瑟斯顿文章 [[42]] 在内的多次反驳。），数学家一直不愿意偏离其严密演绎证明的“金标准”太远，部分原因是一旦不再坚持此类标准，就会产生许多显而易见的低质量数学作品[^15]（[^15]：Kim [24] 用货币比喻来描述这种社会动力：职业数学家需要通过证明困难的新数学结果来积累一定信誉“货币”，然后他们才“付得起”成本将这些货币“花”在推测性活动上，如提出猜想或对结果的更广泛后果进行哲学思考。）。但在一个可以通过高度信赖的方式自动产生和验证证明的未来时代，可能将有更多机会安全地探索此类更广泛的数学推理和讨论模式。

这些新技术也可能对数学的长期目标产生显著的负面影响。在教育层面，我们已经看到许多学生几乎立即求助于现代 AI 工具来完成分配的功课，实现了产生给定问题验证答案的即时目标，代价是牺牲了发展更可持续的数学技能和直觉；同样在研究层面，数据驱动数学的“第四范式” [[20]] 可能会获得极大的成功，以至于挤占了经验证据、理论推理和计算数值等传统范式（其中第二种是目前纯数学的主导范式）。此外，人类数学家从视觉、动觉和其他感官直觉中获得的巨大价值，或基于我们对物理、经济、生物等规律的熟悉而建立的直觉[^16]（[^16]：与此相关，数学论证的“美感”或“优雅”等美学概念可能会比现在与论证的形式正确性更加脱钩。例例如，AlphaProof [2] 对 2024 年国际数学奥林匹克竞赛中问题的证明包含许多冗余或令人费解的步骤，但仍然正式验证为正确解。见 [[17]]。），也可能被排挤。即使假设形式化方法已得到完全信任的实施，在数学研究空间无差别地拥抱 AI 辅助可能会导致一种不理想的结果，即产生洪水般[^17]（[^17]：这可以被视为意外后果规律的一个例证。在过去获得严密证明需要艰苦努力的时代，数学活动自然聚焦于被数学共同体认为有趣的问题。文献演变足够缓慢，以至于确定数学重要性的社会机制可以随时间自我修正。而在一个可以用自动化高速量产数学结果的时代，这些哲学问题可能需要更多主动关注。见 [[31, 14]]，关于在决定是否投入精力处理某项数学声称时，需要进行价值判断，包括评估作者的可信度。）的、很大程度上由 AI 生成的论文，它们包含技术上正确且新颖的结果，但却不对更广泛的数学叙事做出贡献，也无法为作者或读者建立起直觉。此类低质量工作产生的负面印象可能会导致对即使是最谨慎和负责任的数学 AI 辅助应用产生污名化，这转而可能抑制此类技术的潜在积极收益，如上所述的以更广泛和更整体的方式探索数学的能力。

#### 4.7 将哲学问题应用于现实世界的 AI 使用
作为其他研究的基础参考，任何内容都承载着额外的责任，数学也不例外。我们可以正式验证任何由 AI 生成的数学论证的有效性；但有效性只是价值的一个组成部分，在现实情况下展示由 AI 驱动的研究时，微妙的价值判断是必要的。对于体量庞大的平庸和非平庸发现中，研究者认为哪些元素特别有趣且值得在研究领域内外分享，以及这些素材如何向更广泛的受众呈现，目前在人类研究者之间尚未标准化。此外，在优先权和信用的分配上也存在不确定性。AI 辅助研究还带来了新的伦理和法律后果，以及关于 AI 生成内容（包括证明）的知识产权权利的悬而未决的问题。

哪些原则应该指导研究人员决定一种或另一种 AI 模型的适用性和最佳应用，或者 AI 是否真的是一个好的选择？在学术领域，假设大多数追求学术研究道路的人是出于让世界变得更好并做出有意义贡献的愿望，这并非不合理。数学家会希望优先考虑那些对数学最有益的用例。所有领域的研究者通常不仅希望优先考虑那些有益于自身领域的用途，也希望优先考虑那些具有跨学科收益的用途。而且可以肯定，大多数将 AI 用于研究目的的人，都会优先考虑造福人类而非危害人类的用途。因此，重要的是在 AI 开发领域内强调是谁在从这些工具中受益，以及产生了什么具体收益来帮助人们识别如何负责信地尽可能优化产出结果。

#### 4.8 知识产权与责任
仅知识产权和责任（或者说是问责制）这一问题就是一个雷区，需要仔细讨论。当 AI 被应用于某个问题时，谁对错误负责？谁因洞察力获得信用？这些可能并不是同一方，也可能不是界限分明的各方。到目前为止，对于大语言模型 (LLM) 训练数据的积累，其开发者的主要辩解是属于“合理使用 (Fair Use)”原则。在美国境内，“合理使用”的应用具有一定的灵活性，这取决于（除其他因素外）知识产权使用的目的 [[12]]。作为一个思想实验，我们可以考虑更大的收益是否值得更大的使用 [[47]]。在一个旨在将世界从迫在眉睫的毁灭中解救出来的场景下，主张借用所有记录在案的知识属于合理使用，这是否合理？如果这种广泛的应用是为了将世界从更遥远的生存威胁（如 climate change）中解救出来，这是否仍然适用？如果是为了“仅仅”终结所有疾病呢？或者是为了根除癌症？既然这些都被假定为 AI 的有益应用，那么赋予 AI 使用所有记录在案的信息以使这些奇迹成为可能，是否合理？

除了对“合理使用”进行极宽泛解释的这类成问题的争论，目前迫切需要分配信用和引用的清晰标准与协议。AI 使用案例不仅会提取研究者的数据，还会提取 AI 之前接受训练的信息、选择哪些信息供 AI 训练的决策（由可能与主要研究人员没有任何互动的软件工程师和设计师做出），当然还有 AI 自身的贡献。在存在成百上千甚至成千上万“隐藏”贡献者的情况下，传统的学术引用系统是否足以分配适当的信誉？或者仅仅引用 AI 模型本身就足够了？未经披露地使用 AI 来完成研究论文中很大一部分的写作已经引发了特别强烈的反应，许多学者认为这种做法类似于剽窃；讽刺的是，这导致一些从工具中受益的研究者甚至更进一步地隐瞒他们的使用情况。显而易见，需要制定关于 AI 披露和使用的新专业标准与实践[^18]（[^18]：关于由本文作者之一发起的这一话题的初步讨论，见 [[7]]）。

AI 还正处于创造潜在广泛循环引用循环的边缘，这一过程在 2001 年被 Randall Munroe 幽默地称为“引用生成 (citogenesis)”[^19]（[^19]：https://xkcd.com/978）。例如，随着最近 AI “深度研究 (deep research)”工具 [[9]] 在发掘埋没在晦涩文献中的开放问题解决方案方面取得成功，本文第二作者在一家数学开放问题网站 [[8]] 上发起了一项工作，通过系统地使用这些工具来汇报这些问题的已知文献或缺失情况。虽然这为网站增加了真正的价值，但我们也发现，这些深度研究工具将这些报告作为其搜索的权威来源，其意外后果是：在网站上总结这些搜索干扰了随后使用这些工具来发现关于这些问题的真正新文献的能力！因此，即使在没有恶意的情况下，这些日益强大的工具也需要我们对引用信息的来源进行更彻底的审查。

### 5. AI 的成本与收益

#### 5.1 经济与社会影响：谁受益？
鉴于 AI 对个人已经产生的重大影响及其快速发展，我们很容易看到一条通往 AI 扩展为全物种生存威胁的路径。每推进一步，开发者和其他有影响力的人士都需要仔细考虑谁在从这些进步中获益，以及谁正在受到伤害。我们建议，任何进一步的发展都应优先考虑全人类的福祉，且 AI 应用应保持对人类（个人或集体）的直接有用性。

对于每一个具体的案例，都应进行评估，以明确预期的受益者是谁。这个特定的 AI 模型或模型的实施方案是造福全社会，还是仅为少数人带来切实的收益（如节约成本）？AI 工具的力量和复杂性如此巨大，如果少数人以牺牲数百万人的利益为代价来获取极端经济利益，将带来不可容忍且无法接受的道德代价。我们必须促进那些将人类的人性置于其商品化之上的 AI 实施方案。

我们不必远寻因优先考虑资本而非人类福祉而导致的灾难性后果。19世纪初，自称为“卢德分子 (Luddites)”的诺丁汉纺织工人经常被武断地描述为反技术和反进步的，但他们暴力反抗自动化的真正原因，是由于自动化将他们赶出岗位，并被低技能、低工资的工人取代。在失业率高企和通货膨胀猖獗的严酷经济环境下，这种对工作的直接威胁构成了对他们生计的生存威胁。虽然我们回顾工业革命的自动化过程认为它总体上有益于社会，但这些利益确实伴随着真实的、可衡量的代价。

今天，与卢德分子的时代不同，我们已经看到熟练工人被 AI 而非低薪体力劳动者取代。由史以来，入门级工作一直是新生代工人通往经济和社会繁荣的路径。当这些工作消失时，机会随之消失。当人类发现自己与那些曾承诺改善其生活质量的工具直接对立时，绝望和怨恨就会演变成愤怒和愤慨。

由于所有新兴技术对全人类都有一些益处，它们也带来了真实的人类成本。对于 AI 这样具有激进颠覆性的技术，人类成本必须在局部和全球层面进行量化，并与收益进行仔细权衡。我们用于评估的指标目前仍然模糊且定义不清。我们要继续现在这种只关注货币损益的做法吗？我们是否应该考虑将资源获取能力的增加与损失的资源进行平衡？我们要考虑生活质量和幸福感等更无形的收益吗？如果是的话，我们如何将这些无形收益与定量的收益进行对比？

不幸的是，目前的商业环境正在寻求一种“奇迹武器 (Wunderwaffe)”，它被优化以获得最强大的力量和最广泛的影响，希望能借此跑赢任何潜在的问题。但是，如果不能量化新兴技术的人力成本，就会为了少数人的利益而给全人类带来巨大损害。此外，在几乎每一个社会领域同时实施 AI，而不考虑它是否为最终用户提供了任何有意义的利益，只会疏远并挫伤各行各业的人。我们已经看到，在未经同意的情况下被迫接受一项技术的自然反应——感到失去控制，由于本能的排斥，人们倾向于拒绝所有 AI 技术，即使这可能面临“把洗澡水和孩子一起倒掉”的风险（即那些确实能提供可量化生活收益的 AI 用例）。如果我们能转而让技术首要关注在量化上改善大多数或所有人的生活，那么相比于仅关注机械劳动、数字劳动和人类劳动的商品化，我们因技术而自我毁灭的可能性要小得多。

#### 5.2 统计 AI 的成本
除了直接的人力成本，如果不考虑其他更模糊和隐藏的成本，就无法实现 AI 的伦理实施。开发和建设高效 AI 基础设施所产生的最实质且最明显的成本，源于这样一个现实：这些技术不同于 20 世纪 70 年代的计算革命，它们不能作为业余爱好或家庭手工业来开发。单靠像史蒂夫·乔布斯这样单一的创新思维，不可能在满是电脑零件的车库里建立起一个帝国。已构建的 AI 模型在能够投入运行、更不用说盈利之前，都需要在硬件、服务器、人才和预训练方面进行大规模投资。

对于 AI 开发所需的规模，一个更好的类比是 19 世纪下半叶在美国建设的横贯大陆铁路网络。建设铁路的公司必须开发并制造庞大的发动机车队，并规划、铺设数千英里的铁轨，然后第一列火车才能快速可靠地将货物从爱荷华州运送到旧金山，从而释放这些公司所押注的经济回报。

基于 AI 的技术的巨额前期投入，导致开发者追求一种利润驱动的资本主义模式，创造了一类新的技术精英。他们操纵着巨额投资资本和管理债务，同时战略性地争夺 finite 资源（土地、能源、水、熟练劳动力等），就像 19 世纪“镀金时代”的强盗大亨那样。正是在那个时代，这些投资的规模导致了经济稳定性、技术获取权以及整个发达社会一般生活质量方面的巨大不平等。

我们的社会已经开始认识到大规模 AI 需求所带来的显著环境成本。沉重的能源和水资源消耗，为那些生活在这些 AI 模型所需庞大设施阴影下的人们带来了严重的日常挑战。虽然有人提出（见 [[13]]），AI 生成的解决方案可以被用来减轻或消除两个世纪人类技术使用带来的沉重气候成本；而且随着基础设施的建成和更高效计算用途的发展，运行这些工具的边际成本可能会随时间下降。然而，到目前为止，还没有任何运行中的大型 AI 模型能提供足以抵消其自身资源消耗和废物排放的解决方案。

此外，值得注意的是，现代 AI 工具并不通过在物理世界中的表现或对现实物理规律不变属性的理解来追求或感知“真理”；相反，这些模型高度依赖人类生成的数据（往往没有署名），以及大量的人类反馈来迭代改进。如果不冒着通过 AI 生成的信息污染我们集体信息体的严重风险，就不可能构建出减少对人类智力劳动依赖的模型。在使用 AI 生成某个领域的“新信息”时，由于“AI 坍缩 (AI collapse)” [[33]] 成为一个严重问题，这种使用是有明确限度的。如果没有足够数量的真实内容，AI 将脱离现实，陷入一种与现实世界没有任何联系的思维模式，并显著阻碍人机界面上有意义的互动。数学凭借其形式化验证过程，对较高水平的 AI 污染可能有更强的耐受力；但正如我们所见，它也不能完全免疫这种危险。

#### 5.3 数字鸿沟 (The Digital Divide)
另一个需要考虑的重大社会成本是：AI 技术可能加剧现有的不平等，或创造新的不平等。原则上，所有人都有能力发挥其自然的智力天赋（当然前提是有足够的教育和支持性环境）；但前沿 AI 模型应用中的趋势已经表明，大规模 AI 工具可能只提供给资金充足或关系广泛的研究小组，或是那些最愿意交出个人数据并无视使用此类模型的任何伦理顾虑的个人。这在“有 AI 阶层”和“无 AI 阶层”之间造成了根本的“数字鸿沟”。

当 AI 有能力根本性地提高研究表现时，优先考虑公平获取权是至关重要的。然而在当前的 AI 景观中，出现了第二种更微妙的数字鸿沟。当主导的 AI 模型被资本化、私有化并在争夺有限资源（投资和依赖性用户群）时，它们（也许并非出于本意）被激励开发具有“尖峰 (spiky)”能力的功能，以保持互面对抗的竞争优势，而不是在不同领域提供一致且平顺的表现。由于机构谈判和市场限制，个人被锁定在某个特定模型中。我们必须面对这种风险：即一个模型会在特定研究领域提供相对于另一个模型的显著优势，甚至在那些能够稳定且轻松获取 AI 资源的群体内部造成分裂。

另一方面，科学和人文研究中 AI 模型的许多益处并不一定需要最先进的模型。较小的“本地模型”以及非 LLM 技术（如证明助手），证明了其产生有意义结果的能力比那些需要处理全人类知识总和的大型数据中心更快、更高效。从现有的大型模型中蒸馏出小型模型具有巨大潜力。通过较小的、用户定义的训练库精确针对特定研究领域，可以利用最先进的 AI 能力。也许一套多元化的、更具针对性的小型模型（由用户社区维护）可以成为目前市面上昂贵且庞大的模型的替代方案。增加对此类社区项目的支持，有助于缓解不平等获取的问题。

虽然许多此类较小的项目可以由较小规模的公共和私人机构可行地开发和运行，但行业从业者和政策制定者已经呼吁采取监管行动，以创造并维护对 AI 技术的公平获取权 [[18]]。作为这一努力的一部分，投资开发国家或多国公共联盟开展先进 AI 研究，并开发大型、公共资助且可公开获取的 AI 资源（或模型）[[22]]，将具有显著优势，从而现成地为那些原本会被私人、企业化模型抛在脑后的人和群体提供 AI 获取权。

#### 5.4 伤害减少 (Harm Reduction)
在航空业初期，飞机旅行是一项极其不安全的技术，发生了无数恐怖事故。今天，它是长途旅行中最安全、最可靠的交通方式。正如 AI 潜力在短期内导致灾难性后果一样，要让它遵循类似的轨迹（希望能减少致命事故），需要采取果断行动来减少伤害。必须定义最佳实践 [[26]]，并设计培训和监管，以加强技术最负责任的用途，同时遏制或禁止隐蔽或有害的用途。

这是一个极其微妙的平衡。一方面，一个谨慎且负责任地使用 AI 辅助的个人，在短期内可能会被那些不那么严谨、通过更快但不那么可靠的 AI 实践来加速工作的对手所超越。与此同时，此类个人可能会因为甚至胆敢尝试将该技术融入其职业工作流程，而受到怀疑 AI 的同行的嘲笑、谴责和排斥。目前这种主要通过自由放任、允许 AI 技术以不受限速度发展的做法，对于让这种微妙、负责任的采用方式占据上风并不乐观。

有一些先例可以借鉴。21 世纪初维基百科 (Wikipedia) 的快速发展最初对教育系统造成了一些冲击。许多学生开始盲目地将该在线资源的文本逐字整合到作业中，许多导师的反应是禁止使用该百科资源。对维基百科不可靠性和潜在偏见的批评司空见惯。然而，随着该网站的成熟，学术界对其优势和劣势有了更深入的了解。关于如何将该资源融入教育和研究，达成了一个大致共识。鼓励（或至少纵容）学生和研究者将维基百科作为对给定主题调查的起点；而且学生被敦促追溯该网站提供的二手资料来源，或对照独立的信息源进行核实，而不是直接使用其文本。今天，维基百科在学术界被广泛接受为一种有用的资源。

我们能否对 AI 达到类似的负责任接受程度？我们对此持审慎乐观的态度；但这需要持续的努力和明确的哲学引导。例如，我们认为，将开发 AI 工具造福所有（或至少大多数）人类而非少数特权群体，视为一种道德和伦理上的必然。它必须能够解决实际的人类需求，并提高尽可能多的人的生活质量和体验；这些工具的实际或潜在危害必须被识别，并与收益进行权衡，并尽可能予以减轻。意识到其中许多目标在实践中难以实现，并不需要过度的愤世嫉俗；但讨论我们希望这些工具与之匹配的价值体系，是实现这些目标的第一步。

当（希望）就这些价值观达成某种共识时，配合上述减轻 AI 最坏影响的行动，必须将注意力转向摩擦最大的源头——AI 与人类之间的接口。为了超越目前这种不安且不稳定的休战状态，我们需要开发一些方法，使个人能够以一种感到满足和充满活力、而非感到严苛和压抑的方式将 AI 工具融入日常生活。随着 AI 的不断发展和演进，人类对 AI 的使用、互动以及最终的关系也需要演进——从便利工具到辅助伙伴，再到现成的协作伙伴。

### 6. 人类 / AI 接口

#### 6.1 短期视角：AI 作为智力产出的“香草精”
我们该如何构思人类与 AI 工具之间的接口？在眼下这一刻，将这些技术主要视为一种猎奇事物仍然是说得通的，许多用户对于如何合理应用它们仍感确定。

我们对度过当前这一转折期的建议是做一个烹饪方面的类比：香草精 (vanilla extract)，这是大多数甜品配方中的常见成分，以其几乎被普遍喜爱的香气而闻名。如果直接饮用，香草精通常被认为是极其难喝的；但少量添加它被广泛认为可以改善和增强菜肴的其他风味，即使它与这些风味已无法区分。虽然人们很容易得出“香草精加得越多越好”的结论，但大多数用过它的人都明白，它有一个上限，超过这个上限就会彻底毁掉整道菜[^20]（[^20]：Tumblr 上一个著名的思想实验得出结论：含有 44% 香草精的蛋糕将无法食用 [[43]]）。我们大多数人对这个上限究竟在哪里并没有清晰的感觉，因此最明智的做法是将其保持为极少量的添加。

同样，目前的 AI 使用可以被视为认知工作流程中的一种可选添加：通过适度实验是很有趣的——例如通过 AI 语言模型润色由人类撰写的文本，以获得语法和措辞建议；或者将要点清单交给 AI 整理成逻辑结构建议。这些轻微的润饰，就像一小滴香草精，会增强并丰富作品的特性，而不会喧宾夺主。然而，如果将被高度依赖的 AI 内容作为此类工作流程的核心组成部分，将不会产生理想、有效或有价值的结果。秉持这种哲学（并适当注明 AI 使用情况），目前无需重新思考人类在数学、科学或艺术创作等智力追求中的基本作用。

#### 6.2 中期视角：作为“红队”的 AI
然而，随着这些工具能力的增强和更广泛的采用，“选择退出 (opt out)”此类技术的能力将会减弱。即使一个人个人选择主动避免使用 AI 辅助，与其互动的同事、学生和专业机构也会越来越多地将 AI 融入他们本身的工作中。目前，人们严重担心整个学术话语领域可能会被洪水般低质量的 AI 生成内容所淹没。在短期内，这可以通过严格的编辑政策禁止大多数形式 of AI 生成内容来对抗；但随着这些工具变得更加普遍，且个性化的 AI 助手网络变得更加普及，将需要一种更微妙的方法。

至少在中期，制定规则和指南来识别更负责任的 AI 用法、并遏制不负责任的使用，同时不改变一个学科的人文属性，仍然是可能的且必要的。简而言之，将 AI 辅助视为一种工具或初级伙伴，而不是人类中心工作的替代品。在这种情况下，区分“蓝队 (blue team)”和“红队 (red team)”任务是有用的[^21]（[^21]：这一术语灵感来自网络安全中防御攻击者的“蓝队”和探查弱点的“红队”之间的区别。）。“蓝队”负责生成新内容和结构，“红队”负责验证、测试或维护这些内容。将 AI 用于“红队”能力，即审查人类生成的内容以寻找错误或改进建议，是相对安全的；但考虑到当前和短期内工具的随机不确定性和缺乏现实根基，信任它们承担任何超出“红队”（可以由人类或更自动化的验证工具如形式证明助手组成）验证能力之外的“蓝队”结构性能力，都是不安全的。在这种哲学中，重点是管理 AI 使用的潜在风险，同时捕获其潜在收益，而不是激进地反思该领域的基本本质。

#### 6.3 长期视角：哲学退却不可避免吗？
但假设有人预见到更遥远的未来，届时 AI 工具当前的弱点已得到圆满解决，它们的能力在所有实际维度上都达到或超过[^22]（[^22]：这种情景有时被称为“通用人工智能 (AGI)”，尽管对这一术语的精确定义尚未达成共识。）了人类专家的水平，从而使风险管理哲学过时。届时我们将如何应对此类先进技术的变革性所带来的复杂哲学问题？

一种选择是简单地退却到不再具有可操作性的纯技术框架中。在数学中，我们有“形式主义”观点，唯一的目的是根据精确的规则操纵数学符号。在科学领域，务实的“闭嘴并计算 (shut up and calculate)”哲学立场扮演着类似角色；在艺术创作中，一个人可以作为一个工匠而非艺术家，创作满足外部客户提供的参数的作品，而不对产品的价值做出任何判断。在每一种情况下，只要达到任务的技术指标，就不再需要区分是人类生成的工作还是 AI 生成的工作。

但是，虽然技术无疑是这些学科的精髓，但它并不能捕获数学、科学和艺术在实践中是如何进行的完整经验，也不能就如何激励下一代学生、或追求什么样的好奇心驱动的研究方向提供太多指导。因此，人们可以转而退却到一种完全不同的立场，即将人类智力或人类创造力赋予一种不可名状的特殊地位，在基础层面上将任何行使这些人类特质的活动，与任何人工智能对该活动的复制永久区分开来——无论后者在技术层面上复制或超越前者的准确程度如何。在这种框架下，人工智能将永远是“非我族类”的：缺乏真正的“灵魂”或“理解”。由于长期以来对自身物种的熟悉，我们习惯了人类是不可靠的，能力是“尖峰”状的，有时甚至会通过随机词汇联想和死记硬背而侥幸成功完成任务；但当 AI 工具表现出类似行为时，人们往往倾向于对它们做出严厉得多的评判，例如将此类失败归结为它们作为“随机鹦鹉 (stochastic parrots)”的固有本质。但也许这种立场只是在否认一个令人不安的事实：即我们引以为傲的人类能力的某些部分，在本质上其实并不比我们现在设计出来的模仿它们的 AI 算法更复杂多精妙。而且，随着 AI 性能的持续进步，这种“人类沙文主义”观点有沦为日益站不住脚的“缝隙中的上帝 (god of the gaps)”哲学的风险，即一系列不断缩小的品质被标榜为人类基本成就的指标，而 AI 目前仍无法复制。

第三种选择是一些此类技术的狂热拥护者所青睐的，即认为人类的所有认知能力很快就会被其 AI 等效物完全取代，从而使关于人类对数学、科学和艺术贡献之价值的哲学讨论变得日益无关紧要。在这种立场的极端版本中，人类智力的行使本身被视为一种不合时宜且枯燥乏味的活动，应该尽快被自动化取代，以便腾出时间和心理空间进行更多的休闲或享乐追求。显然，这种哲学的实施将带有许多风险，例如人类能力的退化达到一个临界点，即我们的物种将集体失去监控、控制甚至理解那些我们已经委任了自身文明的强大 AI 的行动的能力[^23]（[^23]：关于这一框架在实践中是什么样子的愿景，我们推荐阅读科幻电影《瓦力》 (Wall-E) [[46]]。）。

然而，在这些“稻草人”极端立场之间，似乎存在一些哲学上的中间地带，它们可以为人类与 AI 代理之间新兴的合作与互补共存范式提供有用的视角。这方面的一个先例可见于国际象棋界，它曾被视为纯人类智力的精髓。自人类大宗师能击败象棋引擎以来，已经过去了几十年。尽管如此，国际象棋仍然是一项受欢迎且繁荣的人类活动。棋手将引擎融入到训练中，利用它们重新审视旧的国际象棋理论并探索新理论，探查原本无敌的 AI 棋手的漏洞和弱点，或者创造性地引入涉及不同级别 AI 辅助的新形式竞赛。关于国际象棋究竟是什么、以及下棋的价值是什么这些哲学问题，仍然值得一问；而目前被接受的答案与上述三种极端立场中的任何一个都不太相似。

#### 6.4 哥白尼式视角
一种可能性是拥抱天文学中哥白尼革命的认知模拟。在古代，居主导地位的宇宙模型（只要宇宙被视为机械性的）本质上都是地心的，其中地球具有特权的本体论地位，是宇宙静止不动中心，其性质与天上的天堂或底下的地狱有着本质区别。然而，天文学和物理学的多项进展拆解了这一观点，在几个世纪里接连证明了地球实际上是在绕其轴线旋转并绕太阳公转，而太阳本身也绕着银河系的中心旋转，银河系反过来又是不断膨胀的、缺乏任何空间中心概念的宇宙的一部分。事实上，采用一种完全相反的哲学观点——即现在被称为哥白尼原理的观点——变得极其富有成效：即地球只是宇宙中无数行星之一，在其基本自然法面前没有受到任何优待。

乍一看，这种观点似乎威胁到了人类对其家园星球的情感依附，但最终，宇宙对地球的漠不关心与我们对它的强烈投入之间并没有根本性的矛盾；我们仍然可以非常有理有据地优先处理地球特有的问题，而不是其他星球上的问题，同时接受这些其他星球的存在。类似的革命也可见于其他科学的历史发展中，例如达尔文革命废黜了人类在其他不断演化的物种中的独特地位，或者废黜了欧几里得几何作为数学中先验综合真理来源的特权地位。

直到最近，我们的物种也同样拥抱着居智力模式的地心说模拟，其中人类智能站在认知宇宙的中心，从而赋予其特殊的哲学地位。但现在我们正在发现（或创造）其他的智能“行星”，它们在许多方面与我们自己的智能相当，同时在许多方面又截然不同。与其否认这些行星的存在或重要性，或者争论哪些行星配得上成为“中心”，不如接受人类智能和人工智能都存在于同一个本体论类别中，尽管存在许多独特的差异和互补性。虽然我们的兴趣和依恋在很大程度上仍将与人类智力领域联系在一起，但它与其他形式智能的关系是可以被探索的——既是为了更有效地实现各种现实目标的务实目的，也是为了诸如实现对人类认知的外部视角（这在以前很难获得）等哲学原因。

---

### 7. 结论

AI 技术在世界范围内无组织、混乱且广泛的发布，已经以既令人担忧又令人振奋的方式大幅改变了社会、智力和经济领域。虽然毫无疑问，人类需要某种集体的努力（无论是通过监管、市场压力还是某种尚未定义的各种力量），但我们显然还没有达到那个无法从这些新技术的巨大经济和社会成本中解脱出来的临界点。将 AI 融入数学领域的方法已经迅速证明了 AI 能为学术研究、科学进步以及全人类带来的光明前景。数学研究具有很大程度上的客观性和可验证性，这为实验这些新技术并研究其影响提供了一个独特的机会，且这种方式不会对个人或更广泛的社会构成伦理或生存风险。

通过将 AI 应用于数学，我们能够探索更广泛的全球 AI 使用中紧迫的哲学和道德问题。此外，我们可以推断出缓解 AI / 人类接口紧张关系的潜在途径，并提出尊重每种模式为各种场景带来的独特且宝贵特质的合作式 AI / 人类思维的新范式。虽然我们永远无法让神灯里的妖怪回到瓶子里，但我们持乐观态度：随着我们的理解和行动迅速推进，我们一定能拨开烟云，展望一个光明虽然有些不确定的未来。
